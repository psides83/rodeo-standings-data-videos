name: Update historical standings

on:
  schedule:
    # Collect after month-end, safely past midnight Mountain Time year-round.
    # The script accepts delayed runs and labels scheduled snapshots for the prior month.
    - cron: '17 8 1 * *'
  workflow_dispatch:
    inputs:
      standings_year:
        description: 'Standings season year (blank uses current Mountain-time year)'
        required: false
        type: string
      snapshot_month:
        description: 'Snapshot column YYYY-MM (blank uses current month; fetches current earnings, not historical values)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update historical standings CSV on schedule
        if: github.event_name == 'schedule'
        run: npm run update:historical-standings:scheduled

      - name: Update historical standings CSV manually
        if: github.event_name == 'workflow_dispatch'
        env:
          STANDINGS_YEAR: ${{ inputs.standings_year }}
          SNAPSHOT_MONTH: ${{ inputs.snapshot_month }}
        run: npm run update:historical-standings

      - name: Commit CSV changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update historical standings CSV
          file_pattern: data/historical-standings/*-standings-*.csv
